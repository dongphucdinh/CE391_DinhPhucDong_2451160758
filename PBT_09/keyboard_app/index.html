<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>Keyboard Gallery</h1>
            <button id="openPalette" aria-label="Mở command palette">Ctrl + K</button>
        </header>
        <p class="hint">
            ← → đổi ảnh | 1-9 chọn ảnh | Space play/pause | Ctrl+K mở command palette
        </p>
        <div class="gallery">
            <button id="prevBtn" aria-label="Ảnh trước">←</button>
            <img id="mainImage" tabindex="0" aria-label="Ảnh đang hiển thị" src="" alt="Gallery image">
            <button id="nextBtn" aria-label="Ảnh tiếp theo">→</button>
        </div>
        <div id="thumbs" class="thumbs"></div>
        <div class="controls">
            <button id="playBtn" aria-label="Bật hoặc tắt slideshow">Play</button>
            <button id="openModal" aria-label="Mở ảnh trong modal">Open Modal</button>
        </div>
    </div>
    <div id="imageModal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-content">
            <button id="closeModal" aria-label="Đóng modal">×</button>
            <img id="modalImage" src="" alt="Ảnh phóng to">
        </div>
    </div>
    <div id="palette" class="palette hidden" role="dialog" aria-modal="true">
        <div class="palette-box">
            <input id="commandInput" type="text" placeholder="Nhập command..." aria-label="Tìm command">
            <ul id="commandList"></ul>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
