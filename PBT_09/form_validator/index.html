<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form id="registerForm">
            <h1>Đăng ký tài khoản</h1>

            <div class="form-group">
                <label>Tên</label>
                <input type="text" id="name" placeholder="Nhập tên">
                <small id="nameMsg"></small>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="text" id="email" placeholder="example@gmail.com">
                <small id="emailMsg"></small>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu">
                <div class="strength">
                    <div id="strengthBar"></div>
                </div>
                <small id="passwordMsg"></small>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu">
                <small id="confirmMsg"></small>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" id="phone" placeholder="0901-234-567">
                <small id="phoneMsg"></small>
            </div>

            <button id="submitBtn" type="submit" disabled>Đăng ký</button>
        </form>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h2>Đăng ký thành công!</h2>
            <div id="userInfo"></div>
            <button id="closeModal">Đóng</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
