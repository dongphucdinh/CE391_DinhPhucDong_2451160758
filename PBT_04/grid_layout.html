<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>SHOP</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>

<div class="page">
    <header class="header">
        <h1>MyShop</h1>
    </header>

    <section class="hero">
        <h2>Hero Banner</h2>
        <p>Sản phẩm nổi bật hôm nay</p>
    </section>

    <aside class="sidebar">
        <h3>Bộ lọc</h3>
        <label><input type="checkbox"> Áo</label>
        <label><input type="checkbox"> Giày</label>
        <label><input type="checkbox"> Túi</label>
    </aside>

    <main class="main">
        <div class="product">Card 1</div>
        <div class="product">Card 2</div>
        <div class="product featured">Card nổi bật</div>
        <div class="product">Card 4</div>
        <div class="product">Card 5</div>
        <div class="product">Card 6</div>
    </main>

    <aside class="ads">
        <h3>ADS</h3>
        <div class="ad-box">Quảng cáo</div>
    </aside>

    <footer class="footer">
        <p>&copy; 2026 MyShop</p>
    </footer>
</div>

</body>
</html>
